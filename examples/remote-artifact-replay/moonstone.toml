manifest_version = 2

[package]
name = "remote-artifact-replay-demo"
version = "0.1.0"
kind = "script"
description = "Clean-store exact remote artifact replay example"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
run = 'lua main.lua "$@"'

[[dependencies]]
name = "ansicolors"
constraint = "^1.0"
registry = "rocks"
role = "runtime"
