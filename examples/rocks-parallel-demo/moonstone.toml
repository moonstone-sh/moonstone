manifest_version = 2

[package]
name = "rocks-parallel-demo"
version = "0.1.0"
kind = "script"
description = "Cold LuaRocks resolution and concurrent materialization demo"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
verify = 'lua src/verify.lua "$@"'

[[dependencies]]
name = "ansicolors"
constraint = "^1.0"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "argparse"
constraint = "^0.7.1-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "dkjson"
constraint = "^2.9-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "inspect"
constraint = "^3.1.3"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "fun"
constraint = "^0.1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "penlight"
constraint = "^1.14.0-3"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "lpeg"
constraint = "^1.1.0-2"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "luafilesystem"
constraint = "^1.9.0-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "luasocket"
constraint = "^3.1.0-1"
registry = "rocks"
role = "runtime"
