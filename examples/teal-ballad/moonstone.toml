manifest_version = 2

[package]
name = "teal-example"
version = "0.1.0"
kind = "script"
description = "Teal CLI application built with Cyan, Ballad, and argparse"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
check = "moon exec cyan -- build --check-only"
build = "moon exec cyan -- build"
run = 'moon exec cyan -- run src/main.tl "$@"'
export = "moon exec cyan -- build && moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "cyan"
constraint = "^0.4.0-1"
registry = "rocks"
role = "tool"

[[dependencies]]
name = "argparse"
constraint = "^0.7.1-1"
registry = "rocks"
role = "runtime"

[[dependencies]]
name = "argparse-tl-type"
constraint = "*"
registry = "rocks"
role = "tool"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.5"
role = "tool"
