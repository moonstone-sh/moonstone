[package]
name = "teal-example"
version = "0.1.0"
kind = "script"
description = "Teal CLI application built with Ballad and argparse"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
check = "tl check src/main.tl"
build = "mkdir -p dist && tl check src/main.tl && tl gen -o dist/main.lua src/main.tl && tl gen -o dist/cli.lua src/cli.tl"
run = "tl run src/main.tl --"
dev = "mkdir -p dist && tl check src/main.tl && tl gen -o dist/main.lua src/main.tl && tl gen -o dist/cli.lua src/cli.tl && lua dist/main.lua"
export = "moon exec ballad play partiture.lua"

[[dependencies]]
name = "tl"
constraint = "^0.24.8-1"
resolver = "rocks"
role = "runtime"

[[dependencies]]
name = "argparse"
constraint = "^0.7.1-1"
resolver = "rocks"
role = "runtime"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.2.18"
role = "tool"
