name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0' # Matches release.yml

      - name: Check Formatting
        run: zig fmt --check --exclude src/core/assets/templates src/ build.zig

      - name: Build All Targets
        # We ensure that changes don't break the cross-compilation matrix
        run: zig build

      - name: Cross-compile Windows GNU target
        # Keep platform-specific type and API assumptions compile-time checked
        # even when native Windows execution remains exploratory.
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Run Native Tests
        # We run the internal test suite
        run: zig build test

      - name: Checkout pinned LuaRocks reference
        uses: actions/checkout@v4
        with:
          repository: luarocks/luarocks
          ref: 665f160b4d0b79e85e66c6cc83e442d72eb40868
          path: .ci/luarocks-upstream
          fetch-depth: 1

      - name: Verify LuaRocks rockspec compatibility corpus
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake jq libsqlite3-dev libssl-dev lua5.4 pkg-config
          export LUAROCKS_UPSTREAM_DIR="$GITHUB_WORKSPACE/.ci/luarocks-upstream"
          LUA_BIN=lua5.4 tests/upstream/luarocks/run_conformance.sh
          LUA_BIN=lua5.4 tests/upstream/luarocks/run_schema_mutation_matrix.sh
          LUA_BIN=lua5.4 tests/upstream/luarocks/run_projection_parity.sh

      - name: Verify LuaRocks Make materialization and locked replay
        run: tests/e2e/build/luarocks_make_cmodule_contract.sh

      - name: Verify pinned cqueues Make materialization and locked replay
        run: MOONSTONE_REAL_LUAROCKS=1 tests/e2e/resolution/cqueues_real_contract.sh

      - name: Verify pinned LuaFileSystem native materialization and locked replay
        run: MOONSTONE_REAL_LUAROCKS=1 tests/e2e/resolution/luafilesystem_real_contract.sh

      - name: Verify pinned LuaSQL SQLite3 SDK projection and locked replay
        run: MOONSTONE_REAL_LUAROCKS=1 tests/e2e/resolution/luasql_sqlite3_real_contract.sh

      - name: Verify LuaRocks command materialization and locked replay
        run: tests/e2e/build/luarocks_command_contract.sh

      - name: Verify LuaRocks build dependency scope and isolation
        run: tests/e2e/build/luarocks_build_dependencies_contract.sh

      - name: Verify LuaRocks CMake materialization and locked replay
        run: tests/e2e/build/luarocks_cmake_contract.sh

      - name: Verify LuaRocks source.dir materialization and locked replay
        run: tests/e2e/materialization/luarocks_source_dir_contract.sh

      - name: Verify LuaRocks mapped install.lua materialization and locked replay
        run: tests/e2e/materialization/luarocks_install_lua_contract.sh

      - name: Verify LuaRocks install.conf asset materialization and locked replay
        run: tests/e2e/materialization/luarocks_install_conf_contract.sh

      - name: Verify LuaRocks install.lib materialization and locked replay
        run: tests/e2e/materialization/luarocks_install_lib_contract.sh

      - name: Verify LuaRocks copied asset closure and locked replay
        run: tests/e2e/materialization/luarocks_copy_directories_contract.sh

      - name: Verify LuaRocks ordinary patch materialization and locked replay
        run: tests/e2e/materialization/luarocks_patch_contract.sh

      - name: Verify LuaRocks rejected capability diagnostics
        run: tests/e2e/materialization/luarocks_capability_refusals.sh

      - name: Verify LuaRocks source-rock checksum boundaries
        run: tests/e2e/materialization/luarocks_source_rock_md5_contract.sh

      - name: Verify parallel LuaRocks source task lifecycle
        run: tests/e2e/materialization/luarocks_source_parallel_tasks.sh

      - name: Verify native-library environment projection and loader behavior
        run: tests/e2e/commands/native_library_projection.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Contracts Verification Tests
        # We verify TS, Go, and LuaCATS contracts remain valid
        run: ./packages/contracts/tests/run.sh

  windows-core:
    name: Windows Core CLI and Environment
    runs-on: windows-latest
    # Native coverage complements the Windows-GNU compile gate. Keep it
    # non-blocking while Windows runtime coverage gains wider fixture support.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build Moonstone
        run: zig build

      - name: Exercise project directory, projection, and launcher contracts
        shell: pwsh
        run: ./tests/windows/core.ps1

      - name: Upload Windows core harness state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-harness-state
          path: ${{ runner.temp }}/moonstone-windows-core
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Build Release Candidate
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build and package release candidate
        run: |
          zig build release -Doptimize=ReleaseSafe
          python3 -m pip install --user blake3
          python3 scripts/release/package-release.py --overwrite
          version="$(python3 scripts/release/package-release.py --print-version)"
          test -s "dist/releases/$version/release-manifest.json"
          test -s "dist/releases/$version/SHA256SUMS"
