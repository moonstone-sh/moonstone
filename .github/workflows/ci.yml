name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0' # Matches release.yml

      - name: Check Formatting
        run: zig fmt --check --exclude src/core/assets/templates src/ build.zig

      - name: Build All Targets
        # We ensure that changes don't break the cross-compilation matrix
        run: zig build

      - name: Cross-compile Windows GNU target
        # Keep platform-specific type and API assumptions compile-time checked
        # even when native Windows execution remains exploratory.
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Run Native Tests
        # We run the internal test suite
        run: zig build test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Contracts Verification Tests
        # We verify TS, Go, and LuaCATS contracts remain valid
        run: ./packages/contracts/tests/run.sh

  windows-core:
    name: Windows Core CLI and Environment
    runs-on: windows-latest
    # Native coverage complements the Windows-GNU compile gate. Keep it
    # non-blocking while Windows runtime coverage gains wider fixture support.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build Moonstone
        run: zig build

      - name: Exercise project directory, projection, and launcher contracts
        shell: pwsh
        run: ./tests/windows/core.ps1

  release-candidate:
    name: Build Release Candidate
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build and package release candidate
        run: |
          zig build release -Doptimize=ReleaseSafe
          python3 -m pip install --user blake3
          python3 scripts/release/package-release.py --overwrite
          version="$(python3 scripts/release/package-release.py --print-version)"
          test -s "dist/releases/$version/release-manifest.json"
          test -s "dist/releases/$version/SHA256SUMS"
