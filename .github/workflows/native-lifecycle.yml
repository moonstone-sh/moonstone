name: Native Lifecycle
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'
      - run: zig build -Doptimize=ReleaseSafe
      - run: ./tests/windows/core.ps1
        shell: pwsh
      - run: ./tests/windows/installer.ps1
        shell: pwsh
      - run: ./tests/windows/installer.ps1
        shell: powershell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/windows/update.py
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'
      - run: zig build -Doptimize=ReleaseSafe
      - run: bash tests/e2e/commands/runtime_commands.sh
      - run: bash tests/e2e/commands/self_lifecycle.sh
