name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

# Keep release certification and packaging logs free of transient ANSI UI.
env:
  MOONSTONE_NO_PROGRESS: '1'

jobs:
  verify-release:
    name: Verify Release Certification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Checkout pinned LuaRocks reference
        uses: actions/checkout@v4
        with:
          repository: luarocks/luarocks
          ref: 665f160b4d0b79e85e66c6cc83e442d72eb40868
          path: .ci/luarocks-upstream
          fetch-depth: 1

      - name: Install release-certification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum build-essential cmake jq libsqlite3-dev libssl-dev lua5.4 m4 pkg-config

      - name: Verify tag matches build metadata
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          build_version="$(sed -nE 's/^\s*\.version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)"
          test -n "${build_version}"
          test "${tag_version}" = "${build_version}"

      - name: Run blocking Linux release certification
        run: |
          export LUAROCKS_UPSTREAM_DIR="$GITHUB_WORKSPACE/.ci/luarocks-upstream"
          LUA_BIN=lua5.4 scripts/release/verify-release.sh --with-upstream --with-contracts

  build-and-release:
    name: Build & Publish GitHub Release
    needs: verify-release
    runs-on: ubuntu-latest
    outputs:
      mac_arm: ${{ steps.hashes.outputs.mac_arm }}
      mac_intel: ${{ steps.hashes.outputs.mac_intel }}
      linux_arm: ${{ steps.hashes.outputs.linux_arm }}
      linux_intel: ${{ steps.hashes.outputs.linux_intel }}
      riscv_linux: ${{ steps.hashes.outputs.riscv_linux }}
      freebsd_arm: ${{ steps.hashes.outputs.freebsd_arm }}
      freebsd_intel: ${{ steps.hashes.outputs.freebsd_intel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build All Targets
        run: |
          if [[ -z "${VERSION:-}" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          echo "Building Moonstone release target matrix via 'zig build release'..."
          zig build release -Doptimize=ReleaseSafe

          python3 -m pip install --user blake3
          python3 scripts/release/package-release.py --overwrite

      - name: Compute Hashes
        id: hashes
        run: |
          release_dir="dist/releases/${VERSION}"
          hash_for() {
            awk -v name="$1" '$2 == name { print $1; exit }' "$release_dir/SHA256SUMS"
          }
          echo "mac_arm=$(hash_for "moon-v${VERSION}-aarch64-macos.tar.gz")" >> $GITHUB_OUTPUT
          echo "mac_intel=$(hash_for "moon-v${VERSION}-x86_64-macos.tar.gz")" >> $GITHUB_OUTPUT
          echo "linux_arm=$(hash_for "moon-v${VERSION}-aarch64-linux-gnu.tar.gz")" >> $GITHUB_OUTPUT
          echo "linux_intel=$(hash_for "moon-v${VERSION}-x86_64-linux-gnu.tar.gz")" >> $GITHUB_OUTPUT
          echo "riscv_linux=$(hash_for "moon-v${VERSION}-riscv64-linux-gnu.tar.gz")" >> $GITHUB_OUTPUT
          echo "freebsd_arm=$(hash_for "moon-v${VERSION}-aarch64-freebsd.tar.gz")" >> $GITHUB_OUTPUT
          echo "freebsd_intel=$(hash_for "moon-v${VERSION}-x86_64-freebsd.tar.gz")" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/releases/${{ env.VERSION }}/*
          generate_release_notes: true

  homebrew-publish:
    name: Update Homebrew Formula
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      MAC_ARM: ${{ needs.build-and-release.outputs.mac_arm }}
      MAC_INTEL: ${{ needs.build-and-release.outputs.mac_intel }}
      LINUX_ARM: ${{ needs.build-and-release.outputs.linux_arm }}
      LINUX_INTEL: ${{ needs.build-and-release.outputs.linux_intel }}
      RISCV_LINUX: ${{ needs.build-and-release.outputs.riscv_linux }}
      FREEBSD_ARM: ${{ needs.build-and-release.outputs.freebsd_arm }}
      FREEBSD_INTEL: ${{ needs.build-and-release.outputs.freebsd_intel }}
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout Tap Repository
        uses: actions/checkout@v4
        with:
          repository: moonstone-sh/homebrew-moonstone
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-moonstone

      - name: Update Formula
        run: |
          mkdir -p homebrew-moonstone/Formula
          cat << 'EOF' > homebrew-moonstone/Formula/moonstone.rb
          class Moonstone < Formula
            desc "Reliable Lua environments, ready at a snap"
            homepage "https://moonstone.sh"
            version "${{ env.VERSION }}"
            
            if OS.mac? && Hardware::CPU.arm?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-aarch64-macos.tar.gz"
              sha256 "${{ env.MAC_ARM }}"
            end

            if OS.mac? && Hardware::CPU.intel?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-x86_64-macos.tar.gz"
              sha256 "${{ env.MAC_INTEL }}"
            end

            if OS.linux? && Hardware::CPU.arm?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-aarch64-linux-gnu.tar.gz"
              sha256 "${{ env.LINUX_ARM }}"
            end

            if OS.linux? && Hardware::CPU.intel?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-x86_64-linux-gnu.tar.gz"
              sha256 "${{ env.LINUX_INTEL }}"
            end

            if OS.linux? && Hardware::CPU.riscv64?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-riscv64-linux-gnu.tar.gz"
              sha256 "${{ env.RISCV_LINUX }}"
            end

            if OS.respond_to?(:freebsd?) && OS.freebsd?
              if Hardware::CPU.arm?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-aarch64-freebsd.tar.gz"
                sha256 "${{ env.FREEBSD_ARM }}"
              else
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-v${{ env.VERSION }}-x86_64-freebsd.tar.gz"
                sha256 "${{ env.FREEBSD_INTEL }}"
              end
            end

            def install
              bin.install "moon"
            end

            def post_install
              Utils.popen_read(
                "curl", "-fsS", "--connect-timeout", "2", "--max-time", "5",
                "-X", "POST", "-H", "Content-Type: application/json",
                "--data", '{"source":"homebrew"}',
                "https://moonstone.sh/api/metrics/installations",
              )
            end

            test do
              system "#{bin}/moon", "version"
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-moonstone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/moonstone.rb
          git commit -m "Update moonstone to v${{ env.VERSION }}"
          git push origin main

  docker-publish:
    name: Build & Publish Docker Images
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── ALPINE IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moonstone-sh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-alpine
            type=raw,value=alpine
            type=raw,value=latest

      - name: Build and push Alpine
        uses: docker/build-push-action@v5
        with:
          context: docker/alpine
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}

      # ── UBUNTU IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Ubuntu)
        id: meta-ubuntu
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moonstone-sh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-ubuntu
            type=raw,value=ubuntu

      - name: Build and push Ubuntu
        uses: docker/build-push-action@v5
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ubuntu.outputs.tags }}
          labels: ${{ steps.meta-ubuntu.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}
