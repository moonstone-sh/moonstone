name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: '0.13.0'

      - name: Build All Targets
        run: |
          # build.zig automatically loops through all target_triples (FreeBSD, RISC-V, ARM, etc.)
          zig build -Doptimize=ReleaseSafe
          
          # Compress all generated cross-compiled binaries
          cd zig-out/bin
          for binary in moon-*; do
            tar -czf "${binary}.tar.gz" "$binary"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/*.tar.gz
          generate_release_notes: true

  docker-publish:
    name: Build & Publish Docker Images
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── ALPINE IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: moonstonesh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-alpine
            type=raw,value=alpine
            type=raw,value=latest

      - name: Build and push Alpine
        uses: docker/build-push-action@v5
        with:
          context: docker/alpine
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}

      # ── UBUNTU IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Ubuntu)
        id: meta-ubuntu
        uses: docker/metadata-action@v5
        with:
          images: moonstonesh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-ubuntu
            type=raw,value=ubuntu

      - name: Build and push Ubuntu
        uses: docker/build-push-action@v5
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ubuntu.outputs.tags }}
          labels: ${{ steps.meta-ubuntu.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}
