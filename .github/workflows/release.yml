name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build All Targets
        run: |
          # build.zig automatically loops through all target_triples (FreeBSD, RISC-V, ARM, etc.)
          zig build -Doptimize=ReleaseSafe
          
          # Compress all generated cross-compiled binaries
          cd zig-out/bin
          for binary in moon-*; do
            tar -czf "${binary}.tar.gz" "$binary"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/*.tar.gz
          generate_release_notes: true

  homebrew-publish:
    name: Update Homebrew Formula
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Download release assets
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: tags/v${{ env.VERSION }}
          file: 'moon-.*\.tar\.gz'
          regex: true
          target: './binaries/'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Hashes
        id: hashes
        run: |
          cd binaries/
          echo "MAC_ARM=$(sha256sum moon-aarch64-macos.tar.gz | awk '{print $1}')" >> $GITHUB_ENV
          echo "MAC_INTEL=$(sha256sum moon-x86_64-macos.tar.gz | awk '{print $1}')" >> $GITHUB_ENV
          echo "LINUX_ARM=$(sha256sum moon-aarch64-linux.tar.gz | awk '{print $1}')" >> $GITHUB_ENV
          echo "LINUX_INTEL=$(sha256sum moon-x86_64-linux.tar.gz | awk '{print $1}')" >> $GITHUB_ENV

      - name: Checkout Tap Repository
        uses: actions/checkout@v4
        with:
          repository: moonstone-sh/homebrew-moonstone
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-moonstone

      - name: Update Formula
        run: |
          cat << 'EOF' > homebrew-moonstone/Formula/moonstone.rb
          class Moonstone < Formula
            desc "Reliable Lua environments, ready at a snap"
            homepage "https://moonstone.sh"
            version "${{ env.VERSION }}"
            
            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-aarch64-macos.tar.gz"
              sha256 "${{ env.MAC_ARM }}"
            end

            if OS.mac? && Hardware::CPU.intel?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-x86_64-macos.tar.gz"
              sha256 "${{ env.MAC_INTEL }}"
            end

            if OS.linux? && Hardware::CPU.arm?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-aarch64-linux.tar.gz"
              sha256 "${{ env.LINUX_ARM }}"
            end

            if OS.linux? && Hardware::CPU.intel?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-x86_64-linux.tar.gz"
              sha256 "${{ env.LINUX_INTEL }}"
            end

            def install
              bin.install "moon"
            end

            test do
              system "#{bin}/moon", "version"
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-moonstone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/moonstone.rb
          git commit -m "Update moonstone to v${{ env.VERSION }}"
          git push origin main

  docker-publish:
    name: Build & Publish Docker Images
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── ALPINE IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moonstone-sh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-alpine
            type=raw,value=alpine
            type=raw,value=latest

      - name: Build and push Alpine
        uses: docker/build-push-action@v5
        with:
          context: docker/alpine
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}

      # ── UBUNTU IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Ubuntu)
        id: meta-ubuntu
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moonstone-sh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-ubuntu
            type=raw,value=ubuntu

      - name: Build and push Ubuntu
        uses: docker/build-push-action@v5
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ubuntu.outputs.tags }}
          labels: ${{ steps.meta-ubuntu.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}
