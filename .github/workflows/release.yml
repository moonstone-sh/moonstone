name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      mac_arm: ${{ steps.hashes.outputs.mac_arm }}
      mac_intel: ${{ steps.hashes.outputs.mac_intel }}
      linux_arm: ${{ steps.hashes.outputs.linux_arm }}
      linux_intel: ${{ steps.hashes.outputs.linux_intel }}
      riscv_linux: ${{ steps.hashes.outputs.riscv_linux }}
      freebsd_arm: ${{ steps.hashes.outputs.freebsd_arm }}
      freebsd_intel: ${{ steps.hashes.outputs.freebsd_intel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag on main merge
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -oE '^\s*\.version\s*=\s*"[^"]+"' build.zig.zon | head -n 1 | cut -d'"' -f2)
          TAG_NAME="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} does not exist. Creating and pushing tag..."
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}" || true
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build All Targets
        run: |
          # Invoke the explicit release step to build all target triples
          zig build release -Doptimize=ReleaseSafe
          
          # Compress all generated cross-compiled binaries
          if [[ -z "${VERSION:-}" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          cd zig-out/bin
          for binary in moon-*; do
            if [[ "$binary" == *.tar.gz ]]; then
              continue
            fi
            
            # Extract the triple from the binary name
            triple="${binary#moon-${VERSION}-}"
            
            # Normalize triple names for release packaging
            if [[ "$triple" == "aarch64-linux-gnu" ]]; then
              triple="aarch64-linux"
            elif [[ "$triple" == "x86_64-linux-gnu" ]]; then
              triple="x86_64-linux"
            elif [[ "$triple" == "riscv64-linux-gnu" ]]; then
              triple="riscv64-linux"
            fi
            
            # Move binary to a temporary standard name "moon" so that it's extracted correctly by Homebrew
            mv "$binary" moon
            tar -czf "moon-${triple}.tar.gz" moon
            rm moon
          done

      - name: Compute Hashes
        id: hashes
        run: |
          cd zig-out/bin
          echo "mac_arm=$(sha256sum moon-aarch64-macos.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "mac_intel=$(sha256sum moon-x86_64-macos.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm=$(sha256sum moon-aarch64-linux.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_intel=$(sha256sum moon-x86_64-linux.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "riscv_linux=$(sha256sum moon-riscv64-linux.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "freebsd_arm=$(sha256sum moon-aarch64-freebsd.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "freebsd_intel=$(sha256sum moon-x86_64-freebsd.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/*.tar.gz
          generate_release_notes: true

  homebrew-publish:
    name: Update Homebrew Formula
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      MAC_ARM: ${{ needs.build-and-release.outputs.mac_arm }}
      MAC_INTEL: ${{ needs.build-and-release.outputs.mac_intel }}
      LINUX_ARM: ${{ needs.build-and-release.outputs.linux_arm }}
      LINUX_INTEL: ${{ needs.build-and-release.outputs.linux_intel }}
      RISCV_LINUX: ${{ needs.build-and-release.outputs.riscv_linux }}
      FREEBSD_ARM: ${{ needs.build-and-release.outputs.freebsd_arm }}
      FREEBSD_INTEL: ${{ needs.build-and-release.outputs.freebsd_intel }}
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout Tap Repository
        uses: actions/checkout@v4
        with:
          repository: moonstone-sh/homebrew-moonstone
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-moonstone

      - name: Update Formula
        run: |
          mkdir -p homebrew-moonstone/Formula
          cat << 'EOF' > homebrew-moonstone/Formula/moonstone.rb
          class Moonstone < Formula
            desc "Reliable Lua environments, ready at a snap"
            homepage "https://moonstone.sh"
            version "${{ env.VERSION }}"
            
            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-aarch64-macos.tar.gz"
              sha256 "${{ env.MAC_ARM }}"
            end

            if OS.mac? && Hardware::CPU.intel?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-x86_64-macos.tar.gz"
              sha256 "${{ env.MAC_INTEL }}"
            end

            if OS.linux? && Hardware::CPU.arm?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-aarch64-linux.tar.gz"
              sha256 "${{ env.LINUX_ARM }}"
            end

            if OS.linux? && Hardware::CPU.intel?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-x86_64-linux.tar.gz"
              sha256 "${{ env.LINUX_INTEL }}"
            end

            if OS.linux? && Hardware::CPU.riscv64?
              url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-riscv64-linux.tar.gz"
              sha256 "${{ env.RISCV_LINUX }}"
            end

            if OS.respond_to?(:freebsd?) && OS.freebsd?
              if Hardware::CPU.arm?
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-aarch64-freebsd.tar.gz"
                sha256 "${{ env.FREEBSD_ARM }}"
              else
                url "https://github.com/moonstone-sh/moonstone/releases/download/v${{ env.VERSION }}/moon-x86_64-freebsd.tar.gz"
                sha256 "${{ env.FREEBSD_INTEL }}"
              end
            end

            def install
              bin.install "moon"
            end

            def post_install
              Utils.popen_read(
                "curl", "-fsS", "--connect-timeout", "2", "--max-time", "5",
                "-X", "POST", "-H", "Content-Type: application/json",
                "--data", '{"source":"homebrew"}',
                "https://moonstone.sh/api/metrics/installations",
              )
            end

            test do
              system "#{bin}/moon", "version"
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-moonstone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/moonstone.rb
          git commit -m "Update moonstone to v${{ env.VERSION }}"
          git push origin main

  docker-publish:
    name: Build & Publish Docker Images
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── ALPINE IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moonstone-sh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-alpine
            type=raw,value=alpine
            type=raw,value=latest

      - name: Build and push Alpine
        uses: docker/build-push-action@v5
        with:
          context: docker/alpine
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}

      # ── UBUNTU IMAGE ──────────────────────────────────────────────────
      - name: Docker meta (Ubuntu)
        id: meta-ubuntu
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moonstone-sh/moonstone
          tags: |
            type=semver,pattern={{version}},suffix=-ubuntu
            type=raw,value=ubuntu

      - name: Build and push Ubuntu
        uses: docker/build-push-action@v5
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ubuntu.outputs.tags }}
          labels: ${{ steps.meta-ubuntu.outputs.labels }}
          build-args: |
            MOONSTONE_VERSION=${{ env.VERSION }}
